name: Validate Android pull request

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out pull request source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Check source and release helpers
        run: |
          python3 tools/check-publish.py
          python3 -m unittest discover -s tools/tests -v

      - name: Run Android tests and release lint
        working-directory: android-app
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintRelease

      - name: Verify native FLAC decoding on the runner
        run: |
          cmake -S android-app/decoder-flac/src/main/jni -B android-app/decoder-flac/build/host -DCMAKE_BUILD_TYPE=Release -DWITH_ASM=OFF
          cmake --build android-app/decoder-flac/build/host --target flacJNI -j 2
          cd android-app
          ./gradlew --no-daemon :app:testDebugUnitTest -PnativeFlacLibraryDir=../decoder-flac/build/host

      - name: Build the release variant without signing or publishing
        working-directory: android-app
        run: ./gradlew --no-daemon :app:assembleRelease
