name: Release Android APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  build:
    # Only new tags; moving or deleting a tag does not republish a version.
    if: github.event.created == true && github.event.deleted == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag and increasing Android version
        run: python3 tools/release.py validate --tag "$RELEASE_TAG" --check-history
      - name: Check release configuration
        run: python3 tools/release.py check-inputs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          QUARK_CLIENT_CONFIG_JSON: ${{ secrets.QUARK_CLIENT_CONFIG_JSON }}
      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Check source and release helpers
        run: |
          python3 tools/check-publish.py
          python3 -m unittest discover -s tools/tests -v
          python3 -m unittest discover -s open-service -v
      - name: Run Android tests and lint without credentials
        working-directory: android-app
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintRelease
      - name: Prepare temporary signing and client files
        run: python3 tools/release.py prepare
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          QUARK_CLIENT_CONFIG_JSON: ${{ secrets.QUARK_CLIENT_CONFIG_JSON }}
      - name: Build the signed release APK
        working-directory: android-app
        run: ./gradlew --no-daemon :app:assembleRelease
        env:
          CRUISE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CRUISE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CRUISE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Verify the APK identity, version, signature and checksums
        run: python3 tools/release.py package --tag "$RELEASE_TAG"
      - name: Remove temporary client and signing files
        if: always()
        run: python3 tools/release.py cleanup
      - name: Transfer only verified release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out publication helpers at the same tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download the verified artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ github.run_id }}
          path: dist
      - name: Publish the completed GitHub Release
        run: bash .github/scripts/publish-release.sh
        env:
          GH_TOKEN: ${{ github.token }}
